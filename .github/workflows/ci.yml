name: RunProcess CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch: # 👈 允许在 GitHub Actions 页面手动点击运行

# 并发控制：如果当前分支已经在跑 CI，再次推送时会取消旧的运行，只跑最新的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
    
jobs:
  # 单独抽出的 Resolve 步骤，作为并行的前置依赖
  resolve:
    runs-on: macos-26
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode 26
      run: sudo xcode-select -s "/Applications/Xcode_26.5.app"

    - name: Resolve Swift Packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -project "RunProcess.xcodeproj" \
          -scheme "RunProcess"

  # 依赖 resolve 成功后，并行跑 arm64 和 x86_64 的测试
  build-and-test:
    needs: resolve
    runs-on: macos-26
    
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode 26
      run: sudo xcode-select -s "/Applications/Xcode_26.5.app"

    # ================= 跑正式版 (Release) 测试 =================
    - name: Test (Release)
      run: |
        set -o pipefail
        
        echo "==> Testing Release for ${{ matrix.arch }}..."
        xcodebuild test \
          -project "RunProcess.xcodeproj" \
          -scheme "RunProcess" \
          -destination "platform=macOS,arch=${{ matrix.arch }}" \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG RUNPROCESS_TEST" \
          | xcbeautify --renderer github-actions

    # ================= 跑预览版 (Preview/Beta) 测试 =================
    - name: Test (Preview/Beta)
      run: |
        set -o pipefail
        
        echo "==> Testing Preview for ${{ matrix.arch }}..."
        xcodebuild test \
          -project "RunProcess.xcodeproj" \
          -scheme "RunProcess Preview" \
          -destination "platform=macOS,arch=${{ matrix.arch }}" \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_ACTIVE_COMPILATION_CONDITIONS="BETA DEBUG RUNPROCESS_TEST" \
          | xcbeautify --renderer github-actions
