name: RunProcess CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
    
jobs:
  # 单独抽出来的 Resolve 步骤，作为并行的前置依赖
  resolve:
    runs-on: macos-26
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode 26
      run: sudo xcode-select -s "/Applications/Xcode_26.5.app"

    - name: Resolve Swift Packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -project "RunProcess.xcodeproj" \
          -scheme "RunProcess"

  # 依赖 resolve 成功后，才会并行分叉出 arm64 和 x86_64
  build-and-test:
    needs: resolve
    runs-on: macos-26
    
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode 26
      run: sudo xcode-select -s "/Applications/Xcode_26.5.app"

    # Release 配置必须真的构建一次：发版产物是 Release，
    # 而 Debug 构建不会走 -O 的 SIL 优化管线，release-only 的问题只有这里能抓到。
    - name: Build (Release)
      run: |
        set -euo pipefail
        for scheme in "RunProcess" "RunProcess Preview"; do
          echo "==> Building $scheme (Release) for ${{ matrix.arch }}..."
          xcodebuild build \
            -project "RunProcess.xcodeproj" \
            -scheme "$scheme" \
            -configuration Release \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        done

    # 测试保持 Debug：@testable import 需要 -enable-testing，Release 不带。
    - name: Test (Debug)
      run: |
        set -euo pipefail
        for scheme in "RunProcess" "RunProcess Preview"; do
          echo "==> Testing $scheme (Debug) for ${{ matrix.arch }}..."
          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "$scheme" \
            -configuration Debug \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        done
