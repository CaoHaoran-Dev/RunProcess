# .github/workflows/pr-validation.yml
name: PR Validation

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Test macOS App
        run: |
          xcodebuild test \
            -scheme "RunProcess" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
