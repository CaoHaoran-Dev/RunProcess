name: Push/PR Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            xcode: '26.3'
          - os: macos-26-intel
            arch: x86_64
            xcode: '26.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build App Only (No Tests)
        run: |
          set -o pipefail
          echo "🔍 Starting compilation process..."
          xcodebuild build \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            OTHER_SWIFT_FLAGS='$(inherited) -Xcc -fmodulemap-allow-subdirectory-search' \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build & Test (RunProcessTests)
        run: |
          set -o pipefail
          echo "🧪 Executing test suites..."
          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            OTHER_SWIFT_FLAGS='$(inherited) -Xcc -fmodulemap-allow-subdirectory-search' \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: ✅ Final Verification
        run: |
          echo "=================================================="
          echo "🎉 Build and Test sequence completed."
          echo "✅ All checks passed."
          echo "=================================================="
