name: Push/PR Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: brew install xcbeautify

      # 1. 先解析依赖，把源码拉下来
      - name: Resolve Dependencies
        run: |
          echo "📦 Resolving Swift Package dependencies..."
          xcodebuild -resolvePackageDependencies -project RunProcess.xcodeproj -scheme RunProcess

      # 2. 🔥 关键补丁：动态寻找 CYaml 的 modulemap 并注入环境变量
      - name: Patch CYaml Modulemap Path
        run: |
          echo "🔍 Searching for CYaml modulemap..."
          # 在 DerivedData 或全局 SPM 缓存中寻找 Yams 的 CYaml 模块映射文件
          MODULEMAP_PATH=$(find ~/Library/Developer/Xcode/DerivedData ~/Library/Caches/org.swift.swiftpm -name "module.modulemap" -path "*Yams*CYaml*" 2>/dev/null | head -n 1)
          
          if [ -z "$MODULEMAP_PATH" ]; then
            echo "❌ Could not find CYaml modulemap!"
            exit 1
          fi
          
          echo "✅ Found CYaml modulemap at: $MODULEMAP_PATH"
          # 提取目录路径，方便后面传给 -Xcc -I
          CYAML_INCLUDE_DIR=$(dirname "$MODULEMAP_PATH")
          
          # 将路径存入 GitHub Actions 的环境变量，供后续步骤使用
          echo "CYAML_MODULEMAP=$MODULEMAP_PATH" >> $GITHUB_ENV
          echo "CYAML_INCLUDE_DIR=$CYAML_INCLUDE_DIR" >> $GITHUB_ENV

      # 3. 编译（带上补丁参数）
      - name: Build App Only (No Tests)
        run: |
          set -o pipefail
          echo "🔍 Starting compilation process..."
          xcodebuild build \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS="-Xcc -fmodule-map-file=${CYAML_MODULEMAP} -Xcc -I${CYAML_INCLUDE_DIR}" \
            | xcbeautify --renderer github-actions

      # 4. 测试（同样带上补丁参数）
      - name: Build & Test (RunProcessTests)
        run: |
          set -o pipefail
          echo "🧪 Executing test suites..."
          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS="-Xcc -fmodule-map-file=${CYAML_MODULEMAP} -Xcc -I${CYAML_INCLUDE_DIR}" \
            | xcbeautify --renderer github-actions

      - name: ✅ Final Verification
        run: |
          echo "=================================================="
          echo "🎉 Build and Test sequence completed."
          echo "✅ All checks passed."
          echo "=================================================="
