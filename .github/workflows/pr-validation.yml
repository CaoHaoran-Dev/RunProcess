name: Push/PR Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            xcode: '26.3'
          - os: macos-15-intel
            arch: x86_64
            xcode: '26.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Resolve Dependencies
        run: |
          echo "📦 Resolving Swift Package dependencies..."
          xcodebuild -resolvePackageDependencies -project RunProcess.xcodeproj -scheme RunProcess

      - name: Build App Only (No Tests)
        run: |
          set -o pipefail
          echo "🔍 Starting compilation process..."
          
          # 动态寻找 CYaml 的 modulemap 路径
          MODULEMAP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*Yams/Sources/CYaml/include/module.modulemap" | head -1)
          if [ -z "$MODULEMAP_PATH" ]; then
            echo "❌ Cannot find CYaml modulemap"
            exit 1
          fi
          echo "Found modulemap at: $MODULEMAP_PATH"

          xcodebuild build \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS="\$(inherited) -Xcc -fmodule-map-file=$MODULEMAP_PATH" \
            | xcbeautify --renderer github-actions

      - name: Build & Test (RunProcessTests)
        run: |
          set -o pipefail
          echo "🧪 Executing test suites..."
          
          # 再次获取 modulemap 路径（确保测试环节也能编译通过）
          MODULEMAP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*Yams/Sources/CYaml/include/module.modulemap" | head -1)
          if [ -z "$MODULEMAP_PATH" ]; then
            echo "❌ Cannot find CYaml modulemap"
            exit 1
          fi

          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS="\$(inherited) -Xcc -fmodule-map-file=$MODULEMAP_PATH" \
            | xcbeautify --renderer github-actions

      - name: ✅ Final Verification
        run: |
          echo "=================================================="
          echo "🎉 Build and Test sequence completed."
          echo "✅ All checks passed."
          echo "=================================================="