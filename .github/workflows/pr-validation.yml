# .github/workflows/pr-validation.yml
name: Push/PR Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20 # 稍微调低了超时时间，因为步骤减少了
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            xcode: '26.3'
          - os: macos-26-intel
            arch: x86_64
            xcode: '26.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Install xcbeautify
        run: brew install xcbeautify

      # --- 正式版测试 (Release) ---
      - name: Build & Test Release
        run: |
          set -o pipefail
          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # --- Preview 测试 (带 BETA 宏) ---
      - name: Build & Test Preview
        run: |
          set -o pipefail
          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess Preview" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG BETA" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.arch }}
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 7