name: Push/PR Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: brew install xcbeautify

      # ✅ 可选：缓存 SwiftPM 包，减少 Yams 等依赖解析的不稳定性
      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ matrix.arch }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-swiftpm-

      - name: Resolve Dependencies
        run: |
          echo "📦 Resolving Swift Package dependencies..."
          # 最多重试 3 次，应对 CI 上 SwiftPM 偶发超时
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project RunProcess.xcodeproj -scheme RunProcess && break
            echo "Resolve attempt $i failed, retrying..."
            sleep 5
          done

      - name: Build App Only (No Tests)
        run: |
          set -o pipefail
          echo "🔍 Starting compilation process..."
          xcodebuild build \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build & Test (RunProcessTests)
        run: |
          set -o pipefail
          echo "🧪 Executing test suites..."
          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: ✅ Final Verification
        run: |
          echo "=================================================="
          echo "🎉 Build and Test sequence completed."
          echo "✅ All checks passed."
          echo "=================================================="
