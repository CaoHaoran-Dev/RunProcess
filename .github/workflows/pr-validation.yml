name: Push/PR Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            xcode: '26.3'
          - os: macos-15-intel
            arch: x86_64
            xcode: '26.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Patch Yams C Target (CI Workaround)
        run: |
          echo "🩹 Patching Yams to inline CYaml..."
          xcodebuild -resolvePackageDependencies -project RunProcess.xcodeproj -scheme RunProcess
          
          YAMS_DIR=$(find ~/Library/Developer/Xcode/DerivedData -path "*Yams/Sources/Yams" -type d 2>/dev/null | head -1)
          CYAML_DIR=$(find ~/Library/Developer/Xcode/DerivedData -path "*Yams/Sources/CYaml" -type d 2>/dev/null | head -1)
          
          if [ -z "$YAMS_DIR" ] || [ -z "$CYAML_DIR" ]; then
            echo "❌ Cannot find Yams directories"
            exit 1
          fi
          
          # 1. 把 CYaml 的 C 源码和头文件暴力复制到 Yams 的源码目录下
          cp "$CYAML_DIR"/*.c "$YAMS_DIR"/
          cp "$CYAML_DIR"/*.h "$YAMS_DIR"/
          
          # 2. 修改 Yams 的 Package.swift
          PKG_FILE=$(find ~/Library/Developer/Xcode/DerivedData -path "*Yams/Package.swift" | head -1)
          if [ -z "$PKG_FILE" ]; then
             echo "❌ Cannot find Package.swift"
             exit 1
          fi
          
          # 移除 Yams target 对 CYaml 的依赖声明
          sed -i '' 's/dependencies: \["CYaml"\]/dependencies: []/' "$PKG_FILE"
          
          echo "✅ Patch complete! Yams is now a standalone monolithic target."

      - name: Build App Only (No Tests)
        run: |
          set -o pipefail
          echo "🔍 Starting compilation process..."
          xcodebuild build \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build & Test (RunProcessTests)
        run: |
          set -o pipefail
          echo "🧪 Executing test suites..."
          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: ✅ Final Verification
        run: |
          echo "=================================================="
          echo "🎉 Build and Test sequence completed."
          echo "✅ All checks passed."
          echo "=================================================="
