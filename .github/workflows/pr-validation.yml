# .github/workflows/pr-validation.yml
name: PR Validation

on:
  workflow_dispatch:                                # 1. 手动触发（在 Actions 页面点按钮）
  push:
    branches: [ "main", "dev" ]                # 2. 代码推送时触发
  pull_request:
    branches: [ "main", "dev" ]                # 3. PR 时触发

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Build and Test macOS App
        run: |
          xcodebuild test \
            -project "RunProcess.xcodeproj" \
            -scheme "RunProcess" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
